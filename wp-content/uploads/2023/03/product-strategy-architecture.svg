<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="grad" x1="20" y1="2" x2="20" y2="38" gradientUnits="userSpaceOnUse">
    <stop stop-color="#43CEA2"/>
    <stop offset="1" stop-color="#185A9D"/>
  </linearGradient>
</defs>
<!-- Outer rounded rectangle: strategy board -->
<rect x="1" y="5" width="38" height="26" rx="3" stroke="url(#grad)" stroke-width="1.6" fill="none"/>
<!-- Top bar / title bar -->
<line x1="1" y1="11" x2="39" y2="11" stroke="url(#grad)" stroke-width="1.4"/>
<!-- Three dots on title bar -->
<circle cx="5.5" cy="8" r="1.1" fill="url(#grad)"/>
<circle cx="9.5" cy="8" r="1.1" fill="url(#grad)"/>
<circle cx="13.5" cy="8" r="1.1" fill="url(#grad)"/>
<!-- Milestone / roadmap line -->
<line x1="7" y1="20" x2="33" y2="20" stroke="url(#grad)" stroke-width="1.3"/>
<!-- Milestone nodes -->
<circle cx="10" cy="20" r="2" stroke="url(#grad)" stroke-width="1.3" fill="none"/>
<circle cx="20" cy="20" r="2" stroke="url(#grad)" stroke-width="1.3" fill="none"/>
<circle cx="30" cy="20" r="2" stroke="url(#grad)" stroke-width="1.3" fill="none"/>
<!-- Labels under each milestone node -->
<line x1="10" y1="23" x2="10" y2="25.5" stroke="url(#grad)" stroke-width="1.2"/>
<rect x="6" y="25.5" width="8" height="2.5" rx="1" fill="url(#grad)" opacity="0.5"/>
<line x1="20" y1="23" x2="20" y2="25.5" stroke="url(#grad)" stroke-width="1.2"/>
<rect x="16" y="25.5" width="8" height="2.5" rx="1" fill="url(#grad)" opacity="0.5"/>
<line x1="30" y1="23" x2="30" y2="25.5" stroke="url(#grad)" stroke-width="1.2"/>
<rect x="26" y="25.5" width="8" height="2.5" rx="1" fill="url(#grad)" opacity="0.5"/>
<!-- Stand / foot -->
<line x1="20" y1="31" x2="20" y2="35" stroke="url(#grad)" stroke-width="1.5"/>
<line x1="14" y1="35" x2="26" y2="35" stroke="url(#grad)" stroke-width="1.5"/>
</svg>
